<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Оптимизированный viewport для мобильных устройств -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Hopscotch with Hands - DuoBrainy.app</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Заглушка Telegram SDK -->
    <script>
      window.Telegram = {
        WebApp: {
          ready: function() {},
          requestFullscreen: function() {
            console.log("Запрос Fullscreen перехвачен заглушкой браузера.");
          },
          isVersionAtLeast: function() { return false; },
          version: "0"
        }
      };
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Hopscotch with Hands - DuoBrainy.app</div>
      </div>
    </div>

    <div id="rotate-screen">
      <img src="Restart.png" alt="Поверните устройство">
    </div>

    <style>
      #unity-logo, #unity-webgl-logo {
        display: none !important;
      }
      
      #rotate-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }
    
      #rotate-screen img {
        width: 50%;
        max-width: 300px;
      }
    </style>

  <script>
    function checkOrientation() {
      let rotateScreen = document.getElementById("rotate-screen");
      if (window.innerHeight > window.innerWidth) {
        rotateScreen.style.display = "flex";
      } else {
        rotateScreen.style.display = "none";
      }
    }

    window.addEventListener("resize", checkOrientation);
    document.addEventListener("DOMContentLoaded", checkOrientation);
  </script>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Hopscotch_WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/Hopscotch_WebGL.data",
        frameworkUrl: buildUrl + "/Hopscotch_WebGL.framework.js",
        codeUrl: buildUrl + "/Hopscotch_WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZNOVANNA",
        productName: "Hopscotch with Hands - DuoBrainy.app",
        productVersion: "1.0.2",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        powerPreference: "high-performance",
        webglContextAttributes: {
          preserveDrawingBuffer: false,
          powerPreference: "high-performance",
          failIfMajorPerformanceCaveat: false
        }
      };

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      canvas.style.background = "url('" + buildUrl + "/Hopscotch_WebGL.jpg') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          console.error(message);
          alert("Ошибка загрузки игры: " + message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
